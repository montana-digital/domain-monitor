services:
  domain-monitor:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8000"
      # DOMAIN_MONITOR_PASSWORD: set-a-password
    volumes:
      # The image runs as uid 1000. This directory must be writable by that user.
      - ./data:/data
    restart: unless-stopped
