[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-monitor"
version = "0.1.3"
description = "Self-hosted web domain monitor for Linux."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "jinja2>=3.1",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "tldextract>=5.1",
  "apscheduler>=3.10",
  "whoisit>=3.0",
  "python-whois>=0.9",
  "playwright>=1.49",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
